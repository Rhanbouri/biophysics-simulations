(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;padding-top:7px}.drag-hint:before{content:'';width:7px;height:7px;border:1px solid var(--orange);border-radius:50%;box-shadow:0 0 0 4px #d7492a10}.canvas-wrap{min-width:0;position:relative}canvas{display:block;width:100%;height:440px;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.readouts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin:0 30px;gap:25px;padding:17px 0 19px;min-height:84px}.readout{display:flex;align-items:center;justify-content:space-between;gap:10px}.readout-label{font-size:12px;color:var(--muted)}.readout-value{font-size:23px;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}.readout:last-child .readout-value{color:var(--orange)}aside{border-left:1px solid var(--line);padding:26px 22px;background:#fcfdfc;display:flex;flex-direction:column;gap:22px}.control-title{font-size:10px;letter-spacing:1.7px;color:var(--muted);margin-bottom:11px;font-weight:600}.segmented{display:flex;background:#edf2ef;padding:3px;border-radius:5px;gap:3px}.segmented button{flex:1;min-height:35px;padding:7px 5px;font-size:12px;border:0;background:transparent;border-radius:3px}.segmented button[aria-pressed=true]{background:var(--green);color:white}.control{display:block;margin:20px 0 0}.control-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}.control output{font-size:14px;font-variant-numeric:tabular-nums;color:var(--green)}input[type=range]{width:100%;accent-color:var(--green);height:25px;margin:8px 0 0}select{width:100%;border:1px solid var(--line);border-radius:4px;background:white;padding:10px 8px;font-size:13px;margin-top:7px;min-height:41px}.presets{display:flex;gap:5px;margin-top:12px}.presets button{flex:1;border:1px solid var(--line);background:white;border-radius:4px;font-size:12px;min-height:33px;padding:5px}.presets button:hover{border-color:var(--orange);color:var(--orange)}.actions{margin-top:auto;display:flex;gap:8px}.play{flex:1;border:0;border-radius:4px;background:var(--green);color:white;font-size:13px;padding:12px 8px}.reset{border:1px solid var(--line);border-radius:4px;background:transparent;padding:0 12px;font-size:18px}.insight{border-left:2px solid var(--orange);padding:0 0 0 12px;font-size:14px;line-height:1.5;min-height:43px}.small-note{font-size:11px;color:var(--muted);line-height:1.5;margin:0}details{font-size:13px;color:var(--muted);margin-top:13px}summary{cursor:pointer;width:fit-content;padding:10px 0}details .math{line-height:1.9;background:white;border-left:2px solid var(--green);padding:13px 18px;color:var(--ink);white-space:pre-line}footer{display:flex;justify-content:space-between;color:#6a7b73;font-size:10px;margin-top:10px;letter-spacing:.4px}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.sr-only:focus{position:static;width:auto;height:auto;clip:auto}.select-label{font-size:12px;color:var(--muted)}

<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('plot'),ctx=canvas.getContext('2d');
const GREEN='#00584d',ORANGE='#d7492a',INK='#233b34',MUTED='#73847c',LINE='#dce6e0';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const fmt=(v,n=2)=>Math.abs(v)<.00001?'0':Number(v.toFixed(n)).toString();
const definitions=[
 {name:'Products',symbol:'A·B',kicker:'01 / PROJECTION & AREA',title:'A shadow. An area.',hint:'Drag either arrow',defaults:{kind:0,a:3,b:3,angle:50},math:'A · B = |A| |B| cos θ\n(A × B)z = |A| |B| sin θ;  |A × B| = parallelogram area\n⊙ = out of the screen (+z); ⊗ = into the screen (−z).\nNonzero perpendicular vectors have zero dot product. Parallel and antiparallel vectors have zero cross product.'},
 {name:'Coordinates',symbol:'r,θ',kicker:'02 / A ROTATING BASIS',title:'The point moves. Its basis turns.',hint:'Drag the point',defaults:{r:2.6,theta:35,delta:15},math:'x = r cos θ; y = r sin θ\neᵣ = (cos θ, sin θ); eθ = (−sin θ, cos θ)\nArc length = r |Δθ|, with Δθ in radians. The orange straight segment is the tangent approximation r Δθ eθ.\ndl = dr eᵣ + r dθ eθ + dz e𝓏; deᵣ = dθ eθ; deθ = −dθ eᵣ. This is the xy slice (z fixed).'},
 {name:'Slope',symbol:'Δx',kicker:'03 / FROM SECANT TO TANGENT',title:'Bring the two points together.',hint:'Drag P or Q',defaults:{x:.5,h:1.1},math:'f(x) = x²; f′(x) = 2x\nSecant slope = [f(x + Δx) − f(x)] / Δx = 2x + Δx\nTangent prediction df = 2x Δx; exact Δf = 2x Δx + (Δx)².\nThe difference is (Δx)². A differential is a local linear approximation.'},
 {name:'Gradient',symbol:'∇f',kicker:'04 / THE DIRECTION OF CHANGE',title:'Which way is uphill?',hint:'Place or drag the tracer',defaults:{field:0,direction:0,view:1,x:1.15,y:.65},math:'Hill: f = exp[−(x² + y²)]; ∇f = −2f (x,y).\nExercise 4, z = 0: f = x² + y²; ∇xy f = (2x,2y). The full 3D gradient is (2x,2y,−2z).\nExercise 5: f = xy exp[−(x² + y²)]; ∇f = exp[−(x² + y²)] (y(1−2x²), x(1−2y²)).\nExercise 5 is a signed field, with two maxima, two minima and a saddle at the origin; it is not an absolute concentration.\nThe tracer follows ±∇f with display speed limited. It illustrates direction, not particle motion or diffusion over time. Diffusion flux is J = −D∇C.'},
 {name:'Circulation',symbol:'∮',kicker:'05 / FOLLOWING A PATH',title:'Across the field, or along it?',hint:'Drag the point around the circle',defaults:{field:0,r:1.6,t:.12,orientation:0},math:'Counterclockwise circle of radius R:\nU = (x,y): ∮U · dl = 0.\nU = (−y,x): ∮U · dl = 2πR².\nU = −eᵣ/r²: ∮U · dl = 0 (origin excluded).\nClockwise orientation reverses the sign. Green arrows show the field; orange arrows show the chosen path tangent. Tracer speed is illustrative.'},
 {name:'Coulomb',symbol:'+ −',kicker:'06 / FORCE & WORK',title:'Does attraction always do work?',hint:'Drag the moving charge',defaults:{path:0,ra:1,rb:2.5,t:.3},math:'Opposite charges attract: F = −K eᵣ/r²; K = q²/(4πε₀).\nEp = −K/r; W(A → B) = K(1/rB − 1/rA) = −ΔEp.\nAlong a circle, F is perpendicular to displacement: W = 0.\nK = 1 in normalized teaching units. The charge follows a prescribed path, not free motion. Force arrow length is compressed; the force readout is exact.'}
];
definitions.push(
 {name:'Charging',symbol:'±',kicker:'01 / CHARGING BY CONTACT',title:'Attract first. Repel after contact.',hint:'Scrub through the experiment',defaults:{rod:0,t:.25},math:'A neutral conducting ball polarizes near a charged rod: opposite charge shifts toward the rod, producing attraction.\nAfter contact, charge can transfer. The ball and rod then have the same sign and repel.\nA plastic rod rubbed with wool is illustrated as negative; a glass rod rubbed with silk as positive. Electrons transfer; positive lattice ions remain bound.\nThe pendulum motion and charge symbols are schematic, not a quantitative dynamics model.\nLecture: pp. 4–9 and 18–19.'},
 {name:'Atom',symbol:'α',kicker:'02 / RUTHERFORD SCATTERING',title:'A close pass can change everything.',hint:'Drag the incoming beam',defaults:{b:.7,v:2,t:.45},math:'A positive alpha particle is repelled by a compact positive nucleus. Small impact parameters produce stronger deflection.\nThis classical model integrates r″ = κ r / |r|³ using velocity Verlet (normalized m = 1, κ = 1.5). The nucleus is fixed.\nThe beam begins at x = −5; b is its starting offset. Electron screening, recoil and quantum effects are omitted. Sizes and times use teaching units.\nLecture: pp. 13–17. The simulation illustrates Coulomb scattering, not the internal structure of a quantum atom.'},
 {name:'Forces',symbol:'↔',kicker:'03 / COULOMB’S LAW',title:'Double the distance. Quarter the force.',hint:'Drag either charge',defaults:{q1:1,q2:-1,r:2,eps:1},math:'F on 2 = k q₁q₂/(εᵣ r²) e₁₂; F on 1 = −F on 2.\nLike charges repel; opposite charges attract. The forces have equal magnitude even when the charges differ.\nNormalized k = 1. The medium is linear, homogeneous and isotropic; εᵣ is its relative permittivity. Charge positions are prescribed.\nLecture: pp. 20–24.'},
 {name:'Fields',symbol:'ΣE',kicker:'04 / SUPERPOSITION',title:'Two fields. One resultant.',hint:'Drag a charge or place the probe',defaults:{arrangement:0,sep:2,x:0,y:1.2},math:'E(M) = Σ k qᵢ (M − rᵢ)/|M − rᵢ|³; V(M) = Σ kqᵢ/|M − rᵢ|.\nThe orange and grey arrows at M are the individual fields; green is their vector sum. They share a scale at the probe.\nField lines follow E. The moving tracer shows direction, not a physical test-charge trajectory. Point-charge centers are excluded.\nNormalized k = 1. Each nonzero source has magnitude 1.\nLecture: pp. 24–26.'},
 {name:'Symmetry',symbol:'Π',kicker:'05 / SYMMETRY & INVARIANCE',title:'Watch the components cancel.',hint:'Drag the probe',defaults:{geometry:0,opposite:0,a:1.2,y:1.2,r:1.4,z:0,theta:30,motion:0},math:'Pair at (−a,0) and (+a,0), with probe M = (0,y):\nEqual charges: Ex = 0; Ey = 2y/(a² + y²)^(3/2). The field lies in the symmetry plane x = 0.\nOpposite charges (+ on the left): Ex = 2a/(a² + y²)^(3/2); Ey = 0. The field is normal to that antisymmetry plane.\nAn infinite uniformly charged wire has Er = 2kλ/r, Eθ = Ez = 0. Translation along z leaves E unchanged; rotation preserves Er while the radial direction rotates.\nNormalized k = λ = 1; the displayed wire segment represents an infinite wire.\nLecture: pp. 27–33 and 43–45.'},
 {name:'Ring',symbol:'○',kicker:'06 / A CONTINUOUS DISTRIBUTION',title:'Around the ring, sideways cancels.',hint:'Drag M along the axis',defaults:{R:1.4,z:1.2,Q:1,contributions:1},math:'For a uniformly charged ring of radius R and total charge Q = 2πRλ:\nEz(z) = kQz/(R² + z²)^(3/2); V(z) = kQ/√(R² + z²).\nOpposite elements cancel transverse field components. On the axis, Ex = Ey = 0.\nAt z = 0, E = 0 while V is generally nonzero. For fixed R and Q, |Ez| is largest at |z| = R/√2.\nNormalized k = 1. Total Q is held fixed when R changes. Element arrows are enlarged to show their directions.\nLecture: pp. 46–48 and 57.'},
 {name:'Potential',symbol:'V',kicker:'07 / POTENTIAL & PATHS',title:'Different paths. The same work.',hint:'Use the path slider',defaults:{route:0,sign:0,ra:1,rb:2.6,t:.45},math:'For one source charge: V = kq/r and E = −∇V. Thus dV = −E · dl.\n∫A→M E · dl = V(A) − V(M). It depends only on endpoints, not the path.\nAn equipotential is perpendicular to E. A closed loop has zero circulation.\nReadout is field work per unit positive test charge; multiply by test charge for work. Normalized k = |q| = 1. The probe follows a prescribed path.\nLecture: pp. 49–57.'},
 {name:'Dipole',symbol:'p',kicker:'08 / THE DIPOLE APPROXIMATION',title:'How far is far enough?',hint:'Drag M around the pair',defaults:{d:1,r:3,theta:35},math:'Charges −q and +q are separated by d; p points from − to + and |p| = qd.\nExact V = kq(1/r₊ − 1/r₋).\nFar from the pair (r ≫ d): V ≈ kp cos θ/r² = k p · r /r³.\nThe approximation improves as r/d increases. On the perpendicular bisector V = 0 exactly, while E is generally nonzero.\nNormalized k = q = 1. The view zooms out as r increases.\nLecture: pp. 58–61.'}
);

definitions.push(
 {name:'Heartbeat',symbol:'♡',kicker:'01 / FROM IMPULSE TO ECG',title:'Follow one heartbeat.',hint:'Drag the time marker',defaults:{t:.27,rate:60,av:100},math:'The schematic sequence is SA node → atrial tissue → AV node delay → His bundle → bundle branches / Purkinje network → ventricular tissue. It shows electrical activation, not blood flow.\nP: atrial depolarization. QRS: ventricular depolarization. T: ventricular repolarization. Atrial repolarization is not separately drawn.\nIn this teaching model, P starts at 20 ms and ends at 100 ms; QRS begins at 100 ms + the adjustable AV delay and lasts 80 ms. PR interval = P onset to QRS onset; PR segment = P end to QRS onset.\nChanging rate changes cycle length (60/rate seconds); changing AV delay moves QRS and T. Playback is slowed 4×. Waveforms and chamber activation are illustrative, not patient recordings.\nLecture: pp. 4–15, 46–50, 104.'},
 {name:'Cell',symbol:'↥',kicker:'02 / A VENTRICULAR MUSCLE CELL',title:'A spike. A plateau. A reset.',hint:'Drag the time marker',defaults:{t:130,plateau:180},math:'Membrane voltage is intracellular minus extracellular potential. This is a contractile ventricular cell, not an SA-node pacemaker cell.\nThe piecewise teaching curve shows resting voltage near −90 mV, fast Na⁺ entry, an early notch, a Ca²⁺-supported plateau with simultaneous K⁺ efflux, and K⁺-dominated repolarization. It is not an ionic-current solver.\nThe contraction indicator is a delayed schematic response to activation; ion counts, channel sizes and mechanical force are not quantitative. Varying plateau duration is an illustrative intervention, not a clinical prediction.\nLecture: pp. 16–32.'},
 {name:'Wavefront',symbol:'→',kicker:'03 / WHY A TRACE GOES UP OR DOWN',title:'Same journey. Opposite signal.',hint:'Scrub the moving front',defaults:{t:.38,front:0,direction:0},math:'A traveling boundary separates regions with different extracellular charge. Depolarization toward a positive electrode gives a positive deflection; reversing travel reverses the sign. Repolarization has the opposite dipole orientation for the same travel direction.\nThe normalized dipole envelope here is sin(πu), 0 ≤ u ≤ 1. Its voltage sign is travel direction × (+1 for depolarization, −1 for repolarization). Uniform resting or uniformly depolarized tissue produces no net signal in this symmetric model.\nThe tissue strip and two endpoint electrodes are schematic; this is a polarity demonstration, not a forward solution for a whole heart.\nLecture: pp. 33–50.'},
 {name:'Triangle',symbol:'△',kicker:'04 / EINTHOVEN’S TRIANGLE',title:'One arrow. Three views.',hint:'Drag the dipole arrow',defaults:{angle:60,amp:1,lead:1},math:'R, L and F denote right arm, left arm and left leg electrode potentials. I = L − R; II = F − R; III = F − L, so I + III = II at every instant.\nIdeal equal-radius electrode directions: R = (−√3/2, −1/2), L = (√3/2, −1/2), F = (0,1). Potential at each electrode is p · r̂ / √3 in normalized units.\nLead I points at 0°, II at +60°, III at +120°. Frontal angles increase clockwise in this view: patient left is screen right; feet are down. These are signed projections of one centered equivalent dipole.\nLecture: pp. 51–69.'},
 {name:'Reference',symbol:'⊙',kicker:'05 / WILSON & GOLDBERGER',title:'Change the reference. Enlarge the view.',hint:'Shift all three potentials together',defaults:{R:-.5,L:.5,F:1,offset:0,electrode:0,reference:0},math:'Wilson central terminal W = (R + L + F)/3, assuming equal resistors and negligible recorder input current. Wilson VR = R − W (similarly VL and VF).\nGoldberger aVR = R − (L + F)/2 = 1.5 VR; similarly aVL = L − (R + F)/2 and aVF = F − (R + L)/2. The measured electrode is excluded from the augmented reference.\nAdding the same offset to every electrode also shifts each reference by that offset, leaving all lead differences unchanged. W need not be zero; it is zero in the ideal centered symmetric triangle.\nControls set arbitrary illustrative potentials in mV. This is a reference-voltage calculation, not a body model.\nLecture: pp. 70–74.'},
 {name:'Six leads',symbol:'∿',kicker:'06 / ONE HEART, SIX LIMB LEADS',title:'Six traces. The same heartbeat.',hint:'Drag the time marker',defaults:{t:.236,rate:60,axis:60,lead:1},math:'All six traces are computed from the same time-varying equivalent dipole; they are not independently drawn templates. Limb potentials and lead differences use the same equations as the Triangle and Reference labs.\nAngles: I 0°, II +60°, III +120°, aVR −150°, aVL −30°, aVF +90°. With equal electrode radii, augmented lead-vector magnitude is √3/2 times the bipolar magnitude. Equal angle alignment alone therefore does not imply equal voltage amplitude.\nThe synthetic vector is a sum of compact smooth pulses for P, Q, R, S and T. Its integrated QRS vector points along the selected mean axis. The P direction is held at 60°; the T direction rotates with the QRS axis. All strips share one vertical scale and one time scale.\nNo diagnoses are inferred from these geometric teaching signals. Playback is slowed 4×.\nLecture: pp. 73–104.'},
 {name:'Chest',symbol:'V₁',kicker:'07 / A DIFFERENT VIEWING PLANE',title:'Walk around the same source.',hint:'Drag the dipole arrow',defaults:{theta:-25,amp:1,lead:0},math:'Precordial leads V1…V6 measure chest-electrode potential minus Wilson’s central terminal. They view the heart in the transverse plane, unlike the frontal limb-lead plane.\nThis illustration uses six schematic electrode locations on an ellipse, viewed from the feet, with anterior at the top and patient left on screen right. It is not an anatomical electrode-placement guide.\nThe toy homogeneous conductor uses V(r) = p · r / |r|³ in normalized units, with a centered dipole and W = 0 as an assumed reference. Different radii as well as directions affect voltage. Dragging the source shows instantaneous spatial views, not diagnostic R-wave progression.\nLecture: pp. 51–59. This model extends the lecture’s lead-definition concept to a transverse view.'},
 {name:'Axis',symbol:'∠',kicker:'08 / THE MEAN QRS DIRECTION',title:'Add the areas. Find the direction.',hint:'Drag the mean-axis arrow',defaults:{axis:60,lead:0,gain:1},math:'The mean QRS direction is the angle of A = ∫QRS p(t) dt. A lead’s signed QRS area is the projection of A onto its lead vector. Positive and negative parts must both be included.\nHere Q, R and S are compact smooth pulses whose integrated transverse components cancel. The net QRS vector therefore lies along the selected axis. The waveform may remain biphasic when its algebraic area is zero.\nWith this triangle’s normalization: AI = Ax and AaVF = (√3/2) Ay. Recover angle as atan2((2/√3) AaVF, AI), with clockwise-positive frontal angles. If both areas vanish the direction is undefined.\nAn isoelectric lead constrains the axis to either of its two perpendicular directions; another lead resolves the ambiguity. No diagnostic angle categories are applied.\nLecture: pp. 105–114.'}
);

const chapters=[{start:0,end:6,title:"Mathematical tools"},{start:6,end:14,title:"Electrostatic fields"},{start:14,end:22,title:"Electrocardiogram"}];
let chapter=0;

function cellValues(t,plateau){let end=40+plateau,v=-90,stage=0;if(t>=20&&t<25){v=-90+110*(t-20)/5;stage=1}else if(t>=25&&t<40){v=20-10*(t-25)/15;stage=2}else if(t>=40&&t<end){v=10-10*(t-40)/plateau;stage=3}else if(t>=end&&t<end+80){v=-90*(t-end)/80;stage=4}let contraction=t<45||t>end+95?0:Math.min(1,(t-45)/65)*clamp((end+95-t)/80,0,1);return {v,stage,contraction,end}}
